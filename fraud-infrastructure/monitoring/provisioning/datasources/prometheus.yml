# ═══════════════════════════════════════════════════
# HarisAI — Datasource Prometheus pour Grafana
# ═══════════════════════════════════════════════════
# Grafana charge ce fichier au démarrage et configure
# automatiquement la connexion à Prometheus — pas besoin
# de la créer manuellement dans l'interface web.

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"