# ═══════════════════════════════════════════════════
# HarisAI — Docker Compose
# Déploiement complet chez l'opérateur mobile money
# ═══════════════════════════════════════════════════
#
# DÉMARRAGE :
#   docker-compose up -d
#
# ARRÊT :
#   docker-compose down
#
# LOGS :
#   docker-compose logs -f ml-service
#
# SERVICES :
#   ml-service  → FastAPI ML (port 8001)
#   backend     → .NET 8    (port 5000) — à ajouter
#   redis       → Redis     (port 6379)
#   postgres    → PostgreSQL(port 5432)
#   grafana     → Monitoring(port 3000)

version: "3.9"

services:

  # ─── Service ML FastAPI ──────────────────────────
  ml-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: harisai-ml
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - API_KEY=${API_KEY:-harisai-secret-key-change-in-production}
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql+asyncpg://harisai:${POSTGRES_PASSWORD:-harisai123}@postgres/harisai
      - MODEL_PATH=models/xgboost_v1.0.0.pkl
      - MODEL_VERSION=1.0.0
      - OPERATOR_NAME=${OPERATOR_NAME:-BANKILY}
    volumes:
      # Modèle entraîné — monté depuis le host
      # Ne jamais mettre dans l'image Docker
      - ./models:/app/models:ro
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - harisai-network
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─── Redis — Feature Store ────────────────────────
  redis:
    image: redis:7-alpine
    container_name: harisai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --requirepass ${REDIS_PASSWORD:-harisai123}
    volumes:
      - redis-data:/data
    networks:
      - harisai-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-harisai123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── PostgreSQL — Audit Trail ─────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: harisai-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=harisai
      - POSTGRES_USER=harisai
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-harisai123}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - harisai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harisai -d harisai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Grafana — Monitoring ─────────────────────────
  grafana:
    image: grafana/grafana:10.0.0
    container_name: harisai-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-harisai123}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - harisai-network

# ─── Volumes persistants ──────────────────────────
volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local
  grafana-data:
    driver: local

# ─── Réseau interne ───────────────────────────────
networks:
  harisai-network:
    driver: bridge